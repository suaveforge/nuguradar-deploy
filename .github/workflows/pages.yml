name: Deploy NUGU RADAR to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Ensure Pages site exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          get_code=$(curl -sS -o /tmp/pages-get.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$API")
          if [ "$get_code" = 404 ]; then
            post_code=$(curl -sS -o /tmp/pages-post.json -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' "$API" -d '{"build_type":"workflow"}')
            echo "PAGES_ENABLE_HTTP=$post_code"
            cat /tmp/pages-post.json || true
            [ "$post_code" = 201 ] || exit 42
          else
            echo "PAGES_GET_HTTP=$get_code"
            [ "$get_code" = 200 ] || { cat /tmp/pages-get.json; exit 43; }
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
